services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: schoolhub
      POSTGRES_USER: schoolhub_app
      POSTGRES_PASSWORD: replace_with_a_secret_manager_value
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - schoolhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolhub_app -d schoolhub"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  schoolhub_pgdata:
